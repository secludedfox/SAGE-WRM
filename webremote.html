<!DOCTYPE html>
<html lang="en">
<head>

    <title>SAGE Web Remote</title>
    <link rel="stylesheet" href="/static/remote.css">
</head>
<body>
    <div class="rack">
		<div class="LCD">
			<pre id="LCDLINE0">    Connecting...   </pre>
			<pre id="LCDLINE1">                    </pre>
			<pre id="LCDLINE2">                    </pre>
			<pre id="LCDLINE3">                    </pre>
		</div>

			<img src="/static/Enter.png" height="40px" style="margin-right: 128px;">
			<img src="/static/Up.png" height="28px" style="margin-right: 47px;">
			<img src="/static/Down.png" height="28px">

			<button class="button" id="bt1"></button>
